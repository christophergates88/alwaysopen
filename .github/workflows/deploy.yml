name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
# Two quick pushes never race: the second waits, so one job can't roll back the other's deploy.
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run the tests
        run: node --test test/*.test.js
      # The check browser is kept between runs, so most deploys don't download it again.
      - name: Keep the check browser between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-chromium
      - name: Check the site on phones
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.0
          # The check browser. The machine already has the system libraries Chromium needs, so the browser alone is
          # fetched (kept between runs) and proven to start. Only if it does not start are Ubuntu's libraries fetched too:
          # their package servers were unreachable for hours on Nov 11, 2026, which failed two good deploys and then cost
          # every deploy eight minutes of waiting, for fonts the checks do not need.
          npx playwright install chromium
          if ! node --input-type=commonjs -e "require('playwright').chromium.launch().then(b => b.close()).catch(e => { console.error(String(e).slice(0, 300)); process.exit(1); })"; then
            echo "The browser did not start on its own. Fetching its system libraries."
            ok=0
            for i in 1 2; do
              if timeout 240 npx playwright install --with-deps chromium; then ok=1; break; fi
              echo "Browser install with its system libraries failed (try $i of 2)."; [ "$i" = 2 ] || sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::The check browser could not be started, and Ubuntu's package servers did not answer. Run the deploy again later."; exit 1; }
          fi
          node tools/phonecheck.mjs
          APP_SHOTS=app-shots node tools/appcheck.mjs
          APP_SHOTS=app-shots node tools/wallcheck.mjs
      - name: Print the map screenshots (read from the log)
        if: always()
        run: bash tools/printshots.sh
      - name: Keep the app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: app-shots, path: app-shots, if-no-files-found: ignore, retention-days: 14 }
      # A deploy restarts every call room, which cuts a caller off mid-sentence. Wait (up to 40 minutes) until no call
      # is live and no practice run started in the last 3 minutes. If the check itself can't run, say so and go ahead.
      - name: Wait until no call is live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          q="SELECT (SELECT count(*) FROM app_calls WHERE outcome = 'live' AND at > strftime('%Y-%m-%dT%H:%M:%fZ','now','-20 minutes')) AS calls, (SELECT count(*) FROM voice_log WHERE kind = 'rehearse-taken' AND at > strftime('%Y-%m-%dT%H:%M:%fZ','now','-3 minutes')) AS drills"
          fails=0
          for i in $(seq 1 120); do
            out=$(npx -y wrangler@4 d1 execute alwaysopen --remote --json --command "$q" 2>/dev/null || true)
            busy=$(printf '%s' "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results[0];console.log(r.calls+r.drills>0?"busy "+r.calls+" call(s), "+r.drills+" practice run(s)":"clear")}catch(e){console.log("unknown")}})')
            echo "$(date -u +%H:%M:%S) $busy"
            [ "$busy" = "clear" ] && exit 0
            if [ "$busy" = "unknown" ]; then fails=$((fails+1)); [ $fails -ge 3 ] && { echo "::warning::Could not check for live calls; deploying anyway"; exit 0; }; fi
            sleep 20
          done
          echo "::error::A call stayed live for 40 minutes; not deploying now"; exit 1
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # No fallback config: a deploy that can't bind email fails here and the live site stays on the last good version.
        run: npx -y wrangler@4 deploy
      - name: Check the live site, and roll back if it is not healthy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_KEY: ${{ secrets.LEADS_KEY }}
        run: |
          sleep 20
          bad=""
          for i in 1 2 3; do
            bad=""
            h=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "https://alwaysopenoffice.com/health?core=1" || echo 000)
            [ "$h" = "200" ] || bad="health answered $h"
            for p in "/|Your business" "/insurance|Compliance Guard" "/app/LZbZROIqlA85xuGEgarAuKRRO3IuO1En|Demo Plumbing"; do
              url="${p%%|*}"; want="${p#*|}"
              body=$(curl -sS -m 20 "https://alwaysopenoffice.com$url" || true)
              echo "$body" | grep -q "$want" || bad="$bad; $url missing '$want'"
            done
            [ -z "$bad" ] && break
            sleep 15
          done
          if [ -n "$bad" ]; then
            echo "Live check failed: $bad"
            npx -y wrangler@4 rollback --message "Rolled back by the deploy check: $bad" --yes || true
            if [ -n "$OPS_KEY" ]; then curl -sS -m 20 -X POST -H "x-key: $OPS_KEY" -H "content-type: application/json" -d "{\"why\":\"$(echo "$bad" | tr -d '"' | cut -c1-300)\"}" https://alwaysopenoffice.com/ops/deploy-failed || true; fi
            exit 1
          fi
      - name: Check that alert emails still send (no rollback for this one)
        env:
          OPS_KEY: ${{ secrets.LEADS_KEY }}
        run: |
          [ -n "$OPS_KEY" ] || exit 0
          m=$(curl -sS -m 30 -X POST -H "x-key: $OPS_KEY" https://alwaysopenoffice.com/ops/mail-test || echo '{"ok":false,"result":"no answer"}')
          echo "$m"
          echo "$m" | grep -q '"ok":true' && exit 0
          curl -sS -m 20 -X POST -H "x-key: $OPS_KEY" -H "content-type: application/json" -d "{\"why\":\"the site is live, but the alert email test failed: $(echo "$m" | tr -d '"\\' | cut -c1-200)\"}" https://alwaysopenoffice.com/ops/deploy-failed || true
          exit 1
      - name: Tell Christopher if the deploy failed
        if: failure()
        env:
          OPS_KEY: ${{ secrets.LEADS_KEY }}
        run: |
          if [ -n "$OPS_KEY" ]; then curl -sS -m 20 -X POST -H "x-key: $OPS_KEY" https://alwaysopenoffice.com/ops/deploy-failed || true; fi
