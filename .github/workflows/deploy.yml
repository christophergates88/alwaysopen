name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check the site on phones
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          node tools/phonecheck.mjs
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy || npx -y wrangler@4 deploy --config wrangler.noemail.toml
      - name: Tell Christopher if the deploy failed
        if: failure()
        env:
          OPS_KEY: ${{ secrets.LEADS_KEY }}
        run: |
          if [ -n "$OPS_KEY" ]; then curl -sS -m 20 -X POST -H "x-key: $OPS_KEY" https://alwaysopenoffice.com/ops/deploy-failed || true; fi
