name: Diag
on:
  workflow_dispatch:
    inputs:
      windows: { description: 'from,to;from,to (UTC ISO)', required: false }
      grep: { description: 'only events whose url or message has this', required: false }
      sids: { description: 'call SIDs (space separated): print Twilio record of each', required: false }
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Twilio's record of each call
        if: ${{ inputs.sids != '' }}
        env:
          K: ${{ secrets.LEADS_KEY }}
          SIDS: ${{ inputs.sids }}
        run: |
          for s in $SIDS; do echo "===== $s"; curl -sS -m 40 -H "x-key: $K" "https://alwaysopenoffice.com/ops/call-events?sid=$s"; echo; done
      - name: Worker and Durable Object logs around the dropped calls
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WINDOWS: ${{ inputs.windows }}
          GREP: ${{ inputs.grep }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          T = os.environ['T'].strip()
          def call(url, body=None):
              r = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, headers={'Authorization': 'Bearer ' + T, 'content-type': 'application/json'})
              try:
                  return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e:
                  return {'http': e.code, 'body': e.read().decode()[:3000]}
          acct = call('https://api.cloudflare.com/client/v4/accounts')['result'][0]['id']
          ms = lambda s: int(datetime.datetime.fromisoformat(s.replace('Z', '+00:00')).timestamp() * 1000)
          W = [tuple(x.split(',')) for x in (os.environ.get('WINDOWS') or '').split(';') if x.strip()] or [('2026-11-06T14:47:20Z', '2026-11-06T14:47:50Z')]
          G = os.environ.get('GREP') or ''
          for a, b in W:
              print('=====', a, b)
              body = {'queryId': 'diag-drops', 'timeframe': {'from': ms(a), 'to': ms(b)}, 'view': 'events', 'limit': 2000,
                      'parameters': {'datasets': ['cloudflare-workers'], 'filters': [{'key': '$metadata.service', 'operation': 'eq', 'type': 'string', 'value': 'alwaysopen'}], 'filterCombination': 'and'}}
              res = call('https://api.cloudflare.com/client/v4/accounts/' + acct + '/workers/observability/telemetry/query', body)
              if 'http' in res: print(json.dumps(res)[:3000]); continue
              ev = (((res.get('result') or {}).get('events') or {}).get('events')) or []
              print('events', len(ev))
              for e in ev:
                  if G and G not in json.dumps(e): continue
                  m = e.get('$metadata', {}); w = e.get('$workers', {})
                  print(json.dumps({'t': e.get('timestamp'), 'type': m.get('type'), 'level': m.get('level'), 'msg': (m.get('message') or '')[:300], 'error': m.get('error'), 'outcome': w.get('outcome'), 'event': w.get('eventType'), 'entry': w.get('entrypoint'), 'cpu': w.get('cpuTimeMs'), 'wall': w.get('wallTimeMs'), 'req': (w.get('event') or {}).get('request', {}).get('url') if isinstance(w.get('event'), dict) else None})[:900])
          PY
