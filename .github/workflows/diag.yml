name: Diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Durable Object and Worker errors around the failed calls
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          T = os.environ['T'].strip()
          def call(url, body=None):
              r = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers={'Authorization': 'Bearer ' + T, 'content-type': 'application/json'})
              return json.load(urllib.request.urlopen(r))
          acct = call('https://api.cloudflare.com/client/v4/accounts')['result'][0]['id']
          Q = '''query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){
            d:durableObjectsInvocationsAdaptiveGroups(limit:50,filter:{datetime_geq:$s,datetime_leq:$e}){sum{requests errors} dimensions{status datetimeMinute}}
            w:workersInvocationsAdaptive(limit:50,filter:{datetime_geq:$s,datetime_leq:$e,scriptName:"alwaysopen"}){sum{requests errors} dimensions{status datetime}}}}}'''
          for s, e in [('2026-11-05T16:40:00Z', '2026-11-05T16:43:00Z'), ('2026-11-05T19:59:30Z', '2026-11-05T20:02:30Z')]:
              print('===', s)
              print(json.dumps(call('https://api.cloudflare.com/client/v4/graphql', {'query': Q, 'variables': {'a': acct, 's': s, 'e': e}}))[:6000])
          PY
