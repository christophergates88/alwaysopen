name: Restore drill
# Proves the weekly copy can be restored, without touching the live database: download today's copy from the Worker,
# load it into a fresh SQLite file with tools/restore.mjs, and compare row counts with the live database table by
# table. Run it from the Actions tab (Run workflow) or with the REST API; see docs/restore.md. Nothing is uploaded.
on:
  workflow_dispatch:
jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download today's copy and the live counts
        env:
          OPS_KEY: ${{ secrets.LEADS_KEY }}
        run: |
          curl -sS -f -m 120 -H "x-key: $OPS_KEY" -o copy.jsonl.gz "https://alwaysopenoffice.com/ops/backup?download=1"
          curl -sS -f -m 60 -H "x-key: $OPS_KEY" -o live.json "https://alwaysopenoffice.com/ops/backup?counts=1"
          ls -la copy.jsonl.gz
      - name: Restore it into a fresh database and compare
        run: |
          node tools/restore.mjs copy.jsonl.gz restored.sqlite | tee restore.out
          node -e '
            const fs = require("fs");
            const live = JSON.parse(fs.readFileSync("live.json")).counts;
            const got = JSON.parse(fs.readFileSync("restore.out", "utf8").trim().split("\n").pop());
            let bad = 0, rows = ["| table | live | restored |", "| --- | --- | --- |"];
            for (const t of Object.keys(live).sort()) { const a = live[t], b = got[t] || 0; rows.push("| " + t + " | " + a + " | " + b + (a === b ? "" : " (MISMATCH)") + " |"); if (a !== b) bad++; }
            rows.push("", "Drill run " + new Date().toISOString().slice(0, 10) + ": " + (bad ? bad + " tables differ" : "every table matches"));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n") + "\n");
            console.log(rows.join("\n"));
            process.exit(bad ? 1 : 0);
          '
