name: Ops check
# Run by hand (Actions tab, Ops check, Run workflow) or by Claude. It asks the live site two things that cannot be
# asked from outside without a key or a real form, and prints no secret.
#   stripe      is the site on Stripe's live key or its test key? (POST /billing/setup with the ops key: it also
#               remakes the customer portal settings, which is what to run after STRIPE_KEY changes)
#   audit-test  sends the website's own free-audit form with an outside mailbox (typed in the "to" box) as the
#               lead's address, so the email path every prospect depends on is proven end to end. The mailbox is
#               kept out of the log. The lead it makes is named "Chris (mail test)".
#   transfer-test  proves the call screen on a real call, with nobody holding a phone (the "to" box is not used). The
#               4 AM test number calls Always Open's own line and presses 0; the line puts it through to the test
#               number itself, which answers as a robot owner. Run 1: the robot presses 1 (must read as put through).
#               Run 2: the robot is a voicemail box (must NOT read as put through; the caller hears the missed-transfer
#               line). Each is judged about 3 minutes after it is placed, and the test number goes back to turning
#               callers away. Fails if either run is not ok. Needs the 4 AM test call turned on first.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "stripe, audit-test or transfer-test"
        required: true
        default: stripe
      to:
        description: "audit-test only: the outside mailbox to send the audit to"
        required: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Stripe, live or test
        if: inputs.what == 'stripe'
        env:
          OPS_KEY: ${{ secrets.LEADS_KEY }}
        run: |
          [ -n "$OPS_KEY" ] || { echo "The ops key secret is not set."; exit 1; }
          curl -sS -m 40 -X POST -H "x-key: $OPS_KEY" https://alwaysopenoffice.com/billing/setup | head -c 600; echo
      - name: Audit email to an outside mailbox
        if: inputs.what == 'audit-test'
        run: |
          # read from the event file, not the template, and masked, so the mailbox never shows in this public log
          TO=$(jq -r '.inputs.to // ""' "$GITHUB_EVENT_PATH")
          [ -n "$TO" ] || { echo "Type a mailbox in the 'to' box."; exit 1; }
          echo "::add-mask::$TO"
          # the way the page does it: ask for the signed form time, keep the form "open" a few seconds, then send.
          # Without it the request is held as a possible bot and no audit email goes out.
          T=$(curl -sS -m 20 'https://alwaysopenoffice.com/lead?t=1' | jq -r '.t // ""')
          [ -n "$T" ] || { echo "The site gave no form time."; exit 1; }
          sleep 6
          curl -sS -m 40 -X POST -H 'accept: application/json' -H 'origin: https://alwaysopenoffice.com' \
            --form-string 'name=Chris (mail test)' --form-string "email=$TO" --form-string "t=$T" \
            --form-string 'business=Lake Country Foam Party' --form-string 'town=Eatonton, GA' --form-string 'type=Other' \
            --form-string 'notes=Mail test from the ops check. Ignore.' \
            https://alwaysopenoffice.com/lead | head -c 600; echo
      - name: Transfer test call (press 1, then voicemail)
        if: inputs.what == 'transfer-test'
        env:
          OPS_KEY: ${{ secrets.LEADS_KEY }}
        run: |
          [ -n "$OPS_KEY" ] || { echo "The ops key secret is not set."; exit 1; }
          U=https://alwaysopenoffice.com/ops/test-call
          FAIL=0
          for RUN in transfer transfer-vm; do
            echo "== $RUN"
            P=$(curl -sS -m 40 -X POST -H "x-key: $OPS_KEY" -H 'content-type: application/json' -d "{\"run\":\"$RUN\"}" "$U")
            echo "$P" | head -c 600; echo
            if [ "$(echo "$P" | jq -r '.placed // false')" != "true" ]; then FAIL=1; continue; fi
            # the call runs up to about 100 seconds; the write-up and Twilio's reports come in after it
            sleep 170
            J=$(curl -sS -m 40 -X POST -H "x-key: $OPS_KEY" -H 'content-type: application/json' -d '{"judge":1}' "$U")
            # the test number is ours and not a secret, but this log is public: it is shown as "set", not the number
            echo "$J" | jq 'if (.promise | type) == "object" then .promise.callback |= (if . == "" then "" else "set" end) else . end' 2>/dev/null || { echo "The answer was not JSON:"; echo "$J" | head -c 300; echo; }
            [ "$(echo "$J" | jq -r '.ok // false')" = "true" ] || FAIL=1
          done
          [ "$FAIL" = 0 ] || { echo "A transfer test call did not pass. Read 'why' above."; exit 1; }
