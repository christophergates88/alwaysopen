<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Archivo";src:url("FONTS/Archivo.ttf");font-weight:100 900;font-stretch:62% 125%}@font-face{font-family:"Instrument Sans";src:url("FONTS/InstrumentSans.ttf");font-weight:400 700;font-stretch:75% 100%}@font-face{font-family:"DM Mono";src:url("FONTS/DMMono-Medium.ttf");font-weight:500}</style>

<style>
body{margin:0;width:1200px;height:1200px;background:#0F131B;color:#ECEEF3;font-family:"Instrument Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 0 56px;box-sizing:border-box;
 background-image:radial-gradient(700px 500px at 50% 42%,rgba(217,45,32,.18),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:auto,60px 60px,60px 60px}
.wm{display:flex;align-items:center;gap:18px;font:850 46px "Archivo";font-stretch:90%}
.wm i{width:66px;height:66px;border-radius:16px;background:#FF4A3D;display:grid;place-items:center}
.wm i b{width:34px;height:34px;border:7px solid #fff;border-radius:50%;box-sizing:border-box;position:relative}
.wm i b:after{content:"";position:absolute;inset:4px;background:#fff;border-radius:50%}
.neon{display:grid;justify-items:center;gap:8px;padding:30px 74px 24px;border:7px solid #FF6A5E;border-radius:36px;color:#FF6A5E;box-shadow:0 0 0 2px rgba(255,106,94,.25),0 0 60px rgba(255,90,77,.5),inset 0 0 40px rgba(255,90,77,.22)}
.neon b{font:850 128px/1 "Archivo";letter-spacing:.16em;text-shadow:0 0 30px rgba(255,106,94,.9)}
.neon span{font:500 30px "DM Mono";letter-spacing:.3em;opacity:.9}
h1{margin:0;font:850 112px/.97 "Archivo";font-stretch:92%;letter-spacing:-.012em;text-align:center}
h1 em{font-style:normal;color:#FF6A5E}
.line{font-size:38px;color:#C9D0DC;text-align:center;line-height:1.3;max-width:1000px}
.line b{color:#ECEEF3}
.call{display:grid;justify-items:center;gap:6px;padding:26px 60px 22px;border:6px solid #FF6A5E;border-radius:30px;color:#FF6A5E;box-shadow:0 0 0 2px rgba(255,106,94,.25),0 0 50px rgba(255,90,77,.45),inset 0 0 30px rgba(255,90,77,.2)}
.call span{font:500 28px "DM Mono";letter-spacing:.3em;color:#FFB3AC}
.call b{font:850 96px/1 "Archivo";letter-spacing:.01em}
.foot{font:500 28px "DM Mono";letter-spacing:.08em;color:#A3ACBF}
</style></head><body>
<div class="wm"><i><b></b></i>Always Open</div>
<div class="neon"><b>OPEN</b><span>24 HOURS</span></div>
<h1>Your business,<br><em>always</em> open.</h1>
<p class="line">Calls answered. Reviews handled. Jobs followed up.<br><b>You approve it all from your phone.</b></p>
<div class="call"><span>CALL MAX. WE DARE YOU.</span><b>(706) 460-2226</b></div>
<div class="foot">alwaysopenoffice.com &nbsp;·&nbsp; Anywhere in the U.S.</div>
</body></html>
