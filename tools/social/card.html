<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Archivo";src:url("FONTS/Archivo.ttf");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"Instrument Sans";src:url("FONTS/InstrumentSans.ttf");font-weight:400 700}
@font-face{font-family:"DM Mono";src:url("FONTS/DMMono-Medium.ttf");font-weight:500}
body{margin:0;width:1080px;height:1080px;background:#0F131B;color:#ECEEF3;font-family:"Instrument Sans",system-ui,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px 56px;box-sizing:border-box;
 background-image:radial-gradient(640px 460px at 50% 48%,rgba(217,45,32,.18),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:auto,60px 60px,60px 60px}
.wm{display:flex;align-items:center;gap:16px;font:850 40px "Archivo";font-stretch:90%}
.wm i{width:58px;height:58px;border-radius:14px;background:#FF4A3D;display:grid;place-items:center}
.wm i b{width:30px;height:30px;border:6px solid #fff;border-radius:50%;box-sizing:border-box;position:relative}
.wm i b:after{content:"";position:absolute;inset:4px;background:#fff;border-radius:50%}
.mid{display:grid;gap:28px;justify-items:start}
h1{margin:0;font:850 96px/.98 "Archivo";font-stretch:92%;letter-spacing:-.014em;max-width:940px}
h1 em{font-style:normal;color:#FF6A5E;text-shadow:0 0 26px rgba(255,106,94,.55)}
.sub{font-size:36px;line-height:1.3;color:#C9D0DC;max-width:900px;margin:0}
.sub b{color:#ECEEF3}
.neon{display:grid;justify-items:center;gap:6px;padding:26px 56px 22px;border:6px solid #FF6A5E;border-radius:30px;color:#FF6A5E;box-shadow:0 0 0 2px rgba(255,106,94,.25),0 0 50px rgba(255,90,77,.45),inset 0 0 30px rgba(255,90,77,.2);justify-self:start}
.neon span{font:500 26px "DM Mono";letter-spacing:.3em;color:#FFB3AC}
.neon b{font:850 88px/1 "Archivo";letter-spacing:.01em}
.foot{display:flex;justify-content:space-between;align-items:center;font:500 26px "DM Mono";letter-spacing:.08em;color:#A3ACBF}
.foot em{font-style:normal;color:#FF6A5E}
</style></head><body>
<div class="wm"><i><b></b></i>Always Open</div>
<div class="mid">HEADLINE SUB EXTRA</div>
<div class="foot"><span>alwaysopenoffice.com</span><span><em>●</em> open 24 hours</span></div>
</body></html>
